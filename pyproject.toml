[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphertool"
version = "1.0.0"
description = "A lightweight Python tool for classical ciphers, encoding, and number conversion."
requires-python = ">=3.10"
authors = [{ name = "oMiki0826o" }]
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
ciphertool = "cipher_tool:main"

[tool.setuptools.packages.find]
include = ["cipher_tool*"]
